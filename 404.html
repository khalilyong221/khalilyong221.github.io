<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>页面不存在 · 郑永</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%231ed760'/%3E%3C/svg%3E">
<style>
  :root{--bg:#121212;--fg:#eaeaea;--muted:#8a8a8a;--faint:#5a5a5a;--accent:#1ed760}
  html,body{margin:0;padding:0;height:100%}
  body{
    background:var(--bg);color:var(--fg);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    display:flex;align-items:center;justify-content:center;text-align:center;
    padding:24px;-webkit-font-smoothing:antialiased;
  }
  .code{font-size:13px;letter-spacing:.24em;color:var(--faint);margin:0 0 18px}
  h1{font-size:22px;font-weight:500;margin:0 0 12px}
  p{color:var(--muted);font-size:14px;margin:0 0 28px}
  a{
    color:var(--fg);text-decoration:none;font-size:14px;
    border-bottom:1px solid #333;padding-bottom:2px;transition:color .15s ease
  }
  a:hover{color:var(--accent);border-bottom-color:var(--accent)}
</style>
</head>
<body>
<div>
  <p class="code">404</p>
  <h1>这个页面不存在</h1>
  <p>你要找的东西可能已经挪走了，或者从来没在这儿。</p>
  <a href="/">回到首页</a>
</div>
</body>
</html>
